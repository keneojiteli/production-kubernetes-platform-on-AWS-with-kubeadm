global:
  scrape_interval: 15s
  evaluation_interval: 15s

# scrape_config defines targets whose metrics endpoints it polls
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090 # use service name because services are on the same network (quiz-network)

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100