services:
  backend:
    image: ghcr.io/keneojiteli/quiz-backend:${IMAGE_TAG:?IMAGE_TAG must be set}
    expose:
      - "3000" # use IP:port if nginx is installed directly on EC2
    env_file:
      - ./backend.env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - quiz-network
    restart: unless-stopped

  frontend:
    image: ghcr.io/keneojiteli/quiz-frontend:${IMAGE_TAG:?IMAGE_TAG must be set}
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - quiz-network
    restart: unless-stopped

  nginx:
    image: nginx:1.30.4-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - quiz-network

  certbot:
    image: certbot/certbot:v5.7.0
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    profiles:
      - certificate
    restart: unless-stopped

networks:
  quiz-network:
    driver: bridge