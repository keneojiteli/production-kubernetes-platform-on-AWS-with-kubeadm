services:
  backend:
    image: ghcr.io/keneojiteli/quiz-app-backend:v1.0.0
    ports:
      - "127.0.0.1:3000:3000" # use IP:port if nginx is installed directly on EC2
    env_file:
      - ./backend.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - quiz-network
    restart: unless-stopped

  frontend:
    image: ghcr.io/keneojiteli/quiz-app-frontend:v1.0.0
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - backend
    networks:
      - quiz-network
    restart: unless-stopped

networks:
  quiz-network:
    driver: bridge