services:
  backend:
    image: ghcr.io/keneojiteli/quiz-backend:feature-ec2-compose-deployment
    container_name: quiz-backend
    ports:
      - "127.0.0.1:3000:3000" # use IP:port if nginx is installed directly on EC2
    env_file:
      - ./backend.env
    healthcheck:
      # test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - quiz-network
    restart: unless-stopped

  frontend:
    image: ghcr.io/keneojiteli/quiz-frontend:feature-ec2-compose-deployment
    container_name: quiz-frontend
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - quiz-network
    restart: unless-stopped

 # scrape & stores metrics
  prometheus:
    image: prom/prometheus:v3.11.2
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro # EC2 path
      # - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro # local testing/windows path
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090" # this service is not exposed directly to the internet
    networks:
      - quiz-network
    restart: unless-stopped

  # visualize metrics
  grafana:
    image: grafana/grafana:12.4.0
    container_name: grafana
    env_file:
      - ./monitoring.env
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro #EC2 path
      # - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro # local testing/windows path
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - quiz-network
    restart: unless-stopped
    depends_on:
      - prometheus

# expose container metrics
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.3
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - quiz-network
    restart: unless-stopped

#expose EC2 host metrics
  node-exporter:
    image: prom/node-exporter:v1.11.1
    # image: quay.io/prometheus/node-exporter:latest
    container_name: node_exporter
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      # - /:/host:ro,rslave
      - /:/host:ro
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - quiz-network
    restart: unless-stopped

networks:
  quiz-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data: