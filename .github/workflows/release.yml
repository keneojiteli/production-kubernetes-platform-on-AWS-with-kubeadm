# This workflow builds, scans, and pushes images. It does not deploy to the server.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: quiz-release
  cancel-in-progress: false

jobs:
  build-scan-push:
    name: Release - ${{ matrix.app.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - name: backend
            context: ./quiz-app/backend
            dockerfile: ./quiz-app/backend/Dockerfile
            image: quiz-backend

          - name: frontend
            context: ./quiz-app/frontend
            dockerfile: ./quiz-app/frontend/Dockerfile
            image: quiz-frontend

          - name: webhook
            context: ./deploy/monitoring/webhook-receiver
            dockerfile: ./deploy/monitoring/webhook-receiver/Dockerfile
            image: quiz-webhook-receiver

    steps:
     - name: Checkout main
       uses: actions/checkout@v5
       with:
          ref: main
          persist-credentials: false

     - name: Prepare image reference
       id: image
       shell: bash
       env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ matrix.app.image }}
       run: |
          OWNER="${OWNER,,}"
          SHA="$(git rev-parse HEAD)"
          IMAGE="ghcr.io/${OWNER}/${IMAGE_NAME}:sha-${SHA}"

          echo "ref=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${IMAGE}"


     - name: Set up Docker Buildx
       uses: docker/setup-buildx-action@v4

     - name: Build image
       uses: docker/build-push-action@v7
       with:
          context: ${{ matrix.app.context }}
          file: ${{ matrix.app.dockerfile }}
          pull: true
          load: true
          push: false
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}

     - name: Scan image
       uses: aquasecurity/trivy-action@v0.36.0
       with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          cache: false

     - name: Login to GHCR
       uses: docker/login-action@v4
       with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # generated automatically by GitHub for each workflow run

     - name: Push scanned image
       shell: bash
       env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
       run: docker push "$IMAGE_REF"