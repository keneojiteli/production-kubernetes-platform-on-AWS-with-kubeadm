name: CI - Build, Scan and Push Images

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"] # creates release images when you push tags like v1.0.0
  pull_request: # builds and scans PRs but does not push images
    branches: ["main"]

permissions:
  contents: read
  packages: write # allows GHA push to GHCR
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    strategy:
      matrix: # runs same pipeline for frontend & backend instead of duplicating code
        app:
          - name: backend # name for the matrix item
            context: ./quiz-app/backend # folder used by Docker as the build context. Docker can only access files inside this folder during build
            dockerfile: ./quiz-app/backend/Dockerfile # dockerfile location
            image: quiz-backend # image name built & pushed to GHCR
            
          - name: frontend
            context: ./quiz-app/frontend
            dockerfile: ./quiz-app/frontend/Dockerfile
            image: quiz-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Normalize image owner
        id: owner
        run: echo "value=$(echo '${{ env.IMAGE_OWNER }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.app.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for scan
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app.context }} # workflow path is based on the repository root, not from .github/workflows
          file: ${{ matrix.app.dockerfile }}
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.app.image }}:scan
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.app.image }}:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1 # fails the pipeline if HIGH or CRITICAL vulnerabilities are found

      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app.context }}
          file: ${{ matrix.app.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app.name }} # speeds up Docker builds using GitHub Actions cache
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}