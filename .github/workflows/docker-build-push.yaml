name: CI - Build, Scan, Push  & Deploy to server

on:
  # workflow_dispatch:
  push:
    branches: 
      - refactor/containerized-nginx-certbot
    paths:
      - "quiz-app/backend/**" # ** matches everything inside folder including files & directories at all nested levels
      - "quiz-app/frontend/**"
      - ".github/workflows/**"
      - "deploy/**"
 
  pull_request: # builds and scans PRs but does not push images
    branches: ["main"]
    paths:
      - "quiz-app/backend/**" # ** matches everything inside folder including files & directories at all nested levels
      - "quiz-app/frontend/**"
      - "deploy/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # allows GHA push to GHCR
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  AWS_REGION: us-east-1
  EC2_USER: ubuntu
  IMAGE_TAG: sha-${{ github.sha }}
  APP_DOMAIN: kene-quiz@duckdns.org

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - name: backend
            path: ./quiz-app/backend
          - name: frontend
            path: ./quiz-app/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app.path }}
        run: npm ci

      - name: Run lint
        working-directory: ${{ matrix.app.path }}
        run: npm run lint --if-present

      - name: Run tests
        working-directory: ${{ matrix.app.path }}
        run: npm test --if-present

      - name: Build app
        working-directory: ${{ matrix.app.path }}
        run: npm run build --if-present

      - name: Audit dependencies
        working-directory: ${{ matrix.app.path }}
        run: npm audit --audit-level=high

  ci-build-scan-push:
    name: Build, scan & push images
    runs-on: ubuntu-latest
    needs: quality-checks

    strategy:
      matrix: # runs same pipeline for frontend & backend instead of duplicating code
        app:
          - name: backend # name for the matrix item
            context: ./quiz-app/backend # folder used by Docker as the build context. Docker can only access files inside this folder during build
            dockerfile: ./quiz-app/backend/Dockerfile # dockerfile location
            image: quiz-backend # image name built & pushed to GHCR
            
          - name: frontend
            context: ./quiz-app/frontend
            dockerfile: ./quiz-app/frontend/Dockerfile
            image: quiz-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Normalize image owner
        id: owner
        run: echo "value=$(echo '${{ env.IMAGE_OWNER }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set image name & tag
        id: image
        shell: bash
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.app.image }}"
          TAG="sha-${GITHUB_SHA}"

          echo "name=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "full=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image once
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app.context }}
          file: ${{ matrix.app.dockerfile }}
          pull: true
          load: true
          push: false
          tags: ${{ steps.image.outputs.full }}
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.full }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          cache: false

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Commented steps are for debugging
