      - name: Push scanned image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ steps.image.outputs.full }}"

  deploy-ec2:
        name: Deploy to EC2 with docker compose
        needs: ci-build-scan-push
        if: github.ref == 'refs/heads/refactor/containerized-nginx-certbot'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Get GitHub runner IP
              id: ip
              run: |
                echo "ipv4=$(curl -s https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ env.AWS_REGION }}

            - name: Allow SSH from GitHub runner
              run: |
                aws ec2 authorize-security-group-ingress \
                  --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
                  --protocol tcp \
                  --port 22 \
                  --cidr ${{ steps.ip.outputs.ipv4 }}/32

            - name: Copy deploy files to EC2
              uses: appleboy/scp-action@v1
              with: 
                host: ${{ secrets.EC2_HOST }}
                username: ${{ env.EC2_USER }}
                key: ${{ secrets.EC2_SSH_KEY }}
                source: "deploy/compose/docker-compose.prod.yml,deploy/nginx/bootstrap.conf,deploy/nginx/quiz-app.conf"
                target: "/tmp/quiz-app-deploy"

            - name: Deploy on EC2
              uses: appleboy/ssh-action@v1.2.0
              with:
                host: ${{ secrets.EC2_HOST }} # EC2 public IP/ domain
                username: ${{ env.EC2_USER }}
                key: ${{ secrets.EC2_SSH_KEY }} # private SSH key
                script: |
                  set -Eeuo pipefail

                  APP_DIR="/opt/quiz-app"
                  DOMAIN="${{ env.APP_DOMAIN }}"

                  echo "========================================"
                  echo "Preparing deployment directories"
                  echo "========================================"
                  
                  sudo mkdir -p \
                    "${APP_DIR}/nginx" \
                    "${APP_DIR}/certbot/conf" \
                    "${APP_DIR}/certbot/www"

                  sudo chown -R "$USER:$USER" "${APP_DIR}"

                  echo "========================================"
                  echo "Inspecting copied deployment files"
                  echo "========================================"

                  find /tmp/quiz-app-deploy -maxdepth 5 -type f -print

                  echo "========================================"
                  echo "Installing deployment definitions"
                  echo "========================================"

                  cp \
                    /tmp/quiz-app-deploy/deploy/compose/docker-compose.prod.yml \
                    "${APP_DIR}/docker-compose.prod.yml"

                  cp \
                    /tmp/quiz-app-deploy/deploy/nginx/bootstrap.conf \
                    "${APP_DIR}/nginx/bootstrap.conf"

                  cp \
                    /tmp/quiz-app-deploy/deploy/nginx/quiz-app.conf \
                    "${APP_DIR}/nginx/quiz-app.conf"


                  echo "========================================"
                  echo "Creating deployment environment"
                  echo "========================================"

                  cat > "${APP_DIR}/.env" <<EOF
                  IMAGE_TAG=sha-${{ github.sha }}
                  DOMAIN=${{ env.APP_DOMAIN }}
                  EOF

                  cat > "${APP_DIR}/backend.env" <<'EOF'
                  MONGODB_URI=${{ secrets.MONGODB_URI }}
                  NODE_ENV=production
                  EOF

                  chmod 600 \
                    "${APP_DIR}/.env" \
                    "${APP_DIR}/backend.env"


                  echo "========================================"
                  echo "Authenticating to GHCR"
                  echo "========================================"

                  echo "${{ secrets.GHCR_PAT }}" |
                    docker login ghcr.io \
                      --username "${{ env.IMAGE_OWNER }}" \
                      --password-stdin


                  cd "${APP_DIR}"


                  echo "========================================"
                  echo "Validating Docker Compose"
                  echo "========================================"

                  docker compose \
                    -f docker-compose.prod.yml \
                    config --quiet


                  echo "========================================"
                  echo "Checking TLS state"
                  echo "========================================"

                  CERT_FILE="${APP_DIR}/certbot/conf/live/${DOMAIN}/fullchain.pem"


                  if [ -f "${CERT_FILE}" ]; then

                    echo "Existing certificate found."

                    cp nginx/quiz-app.conf nginx/app.conf

                  else

                    echo "No certificate found."
                    echo "Using HTTP bootstrap configuration."

                    cp nginx/bootstrap.conf nginx/app.conf

                  fi


                  echo "========================================"
                  echo "Pulling deployment images"
                  echo "========================================"

                  docker compose \
                    -f docker-compose.prod.yml \
                    pull backend frontend nginx


                  echo "========================================"
                  echo "Starting application platform"
                  echo "========================================"

                  docker compose \
                    -f docker-compose.prod.yml \
                    up -d \
                    --remove-orphans


                  echo "========================================"
                  echo "Waiting for application health"
                  echo "========================================"

                  for SERVICE in backend frontend nginx; do

                    echo "Waiting for ${SERVICE}..."

                    CONTAINER_ID="$(
                      docker compose \
                        -f docker-compose.prod.yml \
                        ps -q "${SERVICE}"
                    )"

                    for i in $(seq 1 24); do

                      STATUS="$(
                        docker inspect \
                          --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                          "${CONTAINER_ID}"
                      )"

                      echo "${SERVICE}: ${STATUS}"

                      if [ "${STATUS}" = "healthy" ]; then
                        break
                      fi

                      if [ "${STATUS}" = "unhealthy" ]; then
                        echo "${SERVICE} became unhealthy"

                        docker compose \
                          -f docker-compose.prod.yml \
                          logs "${SERVICE}"

                        exit 1
                      fi

                      sleep 5

                    done

                  done


                  echo "========================================"
                  echo "Testing internal Docker networking"
                  echo "========================================"

                  docker compose \
                    -f docker-compose.prod.yml \
                    exec -T nginx \
                    wget -qO- \
                    http://backend:3000/health/ready

                  docker compose \
                    -f docker-compose.prod.yml \
                    exec -T nginx \
                    wget -qO- \
                    http://frontend/


                  # ---------------------------------------------------
                  # FIRST DEPLOYMENT ONLY:
                  # obtain the certificate if none exists yet.
                  # ---------------------------------------------------

                  if [ ! -f "${CERT_FILE}" ]; then

                    echo "========================================"
                    echo "Bootstrapping Let's Encrypt certificate"
                    echo "========================================"

                    echo "Verifying HTTP before ACME challenge..."

                    curl \
                      --fail \
                      --silent \
                      --show-error \
                      "http://${DOMAIN}/nginx-health"


                    docker compose \
                      -f docker-compose.prod.yml \
                      --profile certificate \
                      run --rm certbot \
                      certonly \
                      --webroot \
                      --webroot-path=/var/www/certbot \
                      --email "${{ secrets.CERTBOT_EMAIL }}" \
                      --agree-tos \
                      --no-eff-email \
                      -d "${DOMAIN}"


                    echo "Certificate issued successfully."


                    echo "========================================"
                    echo "Activating HTTPS Nginx configuration"
                    echo "========================================"

                    cp nginx/quiz-app.conf nginx/app.conf

                    docker compose \
                      -f docker-compose.prod.yml \
                      up -d \
                      --force-recreate nginx

                    docker compose \
                      -f docker-compose.prod.yml \
                      exec -T nginx \
                      nginx -t


                    docker compose \
                      -f docker-compose.prod.yml \
                      exec -T nginx \
                      nginx -s reload

                  fi


                  echo "========================================"
                  echo "Validating HTTPS deployment"
                  echo "========================================"

                  curl \
                    --fail \
                    --silent \
                    --show-error \
                    --retry 5 \
                    --retry-delay 5 \
                    "https://${DOMAIN}/nginx-health"


                  echo
                  echo "========================================"
                  echo "Deployment status"
                  echo "========================================"

                  docker compose \
                    -f docker-compose.prod.yml \
                    ps


                  echo "Deployment completed successfully."


                  echo "========================================"
                  echo "Cleaning temporary deployment files"
                  echo "========================================"

                  rm -rf /tmp/quiz-app-deploy

                    
            - name: Revoke SSH from GitHub runner
              if: always()
              run: |
                aws ec2 revoke-security-group-ingress \
                  --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
                  --protocol tcp \
                  --port 22 \
                  --cidr ${{ steps.ip.outputs.ipv4 }}/32