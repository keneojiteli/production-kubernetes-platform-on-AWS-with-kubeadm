name: CI - Build, Scan, Push  & Deploy to server

on:
  workflow_dispatch:
  push:
    branches: 
      # - main
      - feature/ec2-compose-deployment
    paths:
      - "quiz-app/backend/**" # ** matches everything inside folder including files & directories at all nested levels
      - "quiz-app/frontend/**"
      - ".github/workflows/**"
      - "deploy/**"
    # tags: ["v*.*.*"] # creates release images when you push tags like v1.0.0
 
  pull_request: # builds and scans PRs but does not push images
    branches: ["main"]
    paths:
      - "quiz-app/backend/**" # ** matches everything inside folder including files & directories at all nested levels
      - "quiz-app/frontend/**"
      - "deploy/**"
      - ".github/workflows/**"

permissions:
  contents: read
  packages: write # allows GHA push to GHCR
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  AWS_REGION: us-east-1
  EC2_USER: ubuntu

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - name: backend
            path: ./quiz-app/backend
          - name: frontend
            path: ./quiz-app/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app.path }}
        run: npm ci

      - name: Run lint
        working-directory: ${{ matrix.app.path }}
        run: npm run lint --if-present

      - name: Run tests
        working-directory: ${{ matrix.app.path }}
        run: npm test --if-present

      - name: Build app
        working-directory: ${{ matrix.app.path }}
        run: npm run build --if-present

      - name: Audit dependencies
        working-directory: ${{ matrix.app.path }}
        run: npm audit --audit-level=high

  ci-build-scan-push:
    name: Build, scan & push images
    runs-on: ubuntu-latest
    needs: quality-checks

    strategy:
      matrix: # runs same pipeline for frontend & backend instead of duplicating code
        app:
          - name: backend # name for the matrix item
            context: ./quiz-app/backend # folder used by Docker as the build context. Docker can only access files inside this folder during build
            dockerfile: ./quiz-app/backend/Dockerfile # dockerfile location
            image: quiz-backend # image name built & pushed to GHCR
            
          - name: frontend
            context: ./quiz-app/frontend
            dockerfile: ./quiz-app/frontend/Dockerfile
            image: quiz-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Normalize image owner
        id: owner
        run: echo "value=$(echo '${{ env.IMAGE_OWNER }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.app.image }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Show repository structure
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type d

      # - name: Check backend lockfile picomatch versions
      #   if: matrix.app.name == 'backend'
      #   run: |
      #     cd ${{ matrix.app.context }}
      #     grep -n "picomatch" package-lock.json || true

      # - name: Check backend lockfile undici versions
      #   if: matrix.app.name == 'backend'
      #   run: |
      #     cd ${{ matrix.app.context }}
      #     grep -n "undici" package-lock.json || true

      - name: Build image for scan
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app.context }} # workflow path is based on the repository root, not from .github/workflows
          file: ${{ matrix.app.dockerfile }}
          pull: true
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.app.image }}:scan
          # cache-from: ""
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}

      # - name: Build image for scan
      #   uses: docker/build-push-action@v7
      #   with:
      #     context: ${{ matrix.app.context }}
      #     file: ${{ matrix.app.dockerfile }}
      #     push: false
      #     load: true
      #     no-cache: true
      #     tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.app.image }}:scan


      # - name: Check backend picomatch version inside built image - for debugging
      #   if: matrix.app.name == 'backend'
      #   run: |
      #    docker run --rm ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.app.image }}:scan npm ls picomatch || true

      # - name: Find exact picomatch source in backend image
      #   if: matrix.app.name == 'backend'
      #   run: |
      #     docker run --rm ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.app.image }}:scan sh -c '
      #       echo "=== app dir ==="
      #       pwd
      #       ls -la /usr/src/app || true

      #       echo "=== npm tree ==="
      #       cd /usr/src/app && npm ls picomatch || true

      #       echo "=== exact picomatch 4.0.3 search ==="
      #       grep -R "\"picomatch\"" /usr/src/app 2>/dev/null | head -100 || true
      #       grep -R "\"version\": \"4.0.3\"" /usr/src/app 2>/dev/null | head -100 || true

      #       echo "=== all package lock files ==="
      #       find /usr/src/app -name "package-lock.json" -o -name ".package-lock.json" -o -name "package.json"
      #     '

      # - name: Find exact undici source in backend image
      #   if: matrix.app.name == 'backend'
      #   run: |
      #     docker run --rm ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.app.image }}:scan sh -c '
      #       echo "=== app dir ==="
      #       pwd
      #       ls -la /usr/src/app || true

      #       echo "=== npm tree ==="
      #       cd /usr/src/app && npm ls undici || true

      #       echo "=== exact undici 6.26.0 search ==="
      #       grep -R "\"undici\"" /usr/src/app 2>/dev/null | head -100 || true
      #       grep -R "\"version\": \"6.26.0\"" /usr/src/app 2>/dev/null | head -100 || true

      #       echo "=== all package lock files ==="
      #       find /usr/src/app -name "package-lock.json" -o -name ".package-lock.json" -o -name "package.json"
      #     '

      - name: Scan image with Trivy
        # uses: aquasecurity/trivy-action@0.35.0
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.app.image }}:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1 # fails the pipeline if HIGH or CRITICAL vulnerabilities are found
          cache: false

      # - name: Scan image with Trivy JSON
      #   uses: aquasecurity/trivy-action@v0.36.0
      #   with:
      #     image-ref: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.app.image }}:scan
      #     format: json
      #     output: trivy-results.json
      #     severity: HIGH,CRITICAL
      #     ignore-unfixed: true
      #     exit-code: 0
      #     cache: false

      # - name: Show Trivy picomatch source
      #   if: matrix.app.name == 'backend'
      #   run: |
      #     cat trivy-results.json | grep -C 10 "picomatch" || true

      # - name: Show Trivy undici source
      #   if: matrix.app.name == 'backend'
      #   run: |
      #     cat trivy-results.json | grep -C 10 "undici" || true

      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.app.context }}
          file: ${{ matrix.app.dockerfile }}
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app.name }} # speeds up Docker builds using GitHub Actions cache
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}

  deploy-ec2:
        name: Deploy to EC2 with docker compose
        needs: ci-build-scan-push
        if: github.ref == 'refs/heads/feature/ec2-compose-deployment'
        # if:  ${{ (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || github.event_name == 'workflow_dispatch'}}
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Get GitHub runner IP
              id: ip
              run: |
                echo "ipv4=$(curl -s https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ env.AWS_REGION }}

            - name: Allow SSH from GitHub runner
              run: |
                aws ec2 authorize-security-group-ingress \
                  --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
                  --protocol tcp \
                  --port 22 \
                  --cidr ${{ steps.ip.outputs.ipv4 }}/32

            - name: Copy deploy files to EC2
              uses: appleboy/scp-action@v1
              with: 
                host: ${{ secrets.EC2_HOST }}
                username: ${{ env.EC2_USER }}
                key: ${{ secrets.EC2_SSH_KEY }}
                source: "deploy/compose/docker-compose.prod.yml,deploy/nginx/quiz-app.conf"
                target: "/tmp/quiz-app-deploy"

            - name: Deploy on EC2
              uses: appleboy/ssh-action@v1.2.0
              with:
                host: ${{ secrets.EC2_HOST }} # EC2 public IP/ domain
                username: ${{ env.EC2_USER }}
                key: ${{ secrets.EC2_SSH_KEY }} # private SSH key
                script: |
                    set -e
                    sudo mkdir -p /opt/quiz-app
                    sudo cp /tmp/quiz-app-deploy/deploy/compose/docker-compose.prod.yml /opt/quiz-app/docker-compose.prod.yml

                    sudo cp /tmp/quiz-app-deploy/deploy/nginx/quiz-app.conf /etc/nginx/sites-available/quiz-app
                    sudo rm -f /etc/nginx/sites-enabled/default
                    sudo ln -sf /etc/nginx/sites-available/quiz-app /etc/nginx/sites-enabled/quiz-app

                    sudo nginx -t
                    sudo systemctl reload nginx

                    echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ env.IMAGE_OWNER }}" --password-stdin

                    cd /opt/quiz-app
                    docker compose -f docker-compose.prod.yml pull
                    docker compose -f docker-compose.prod.yml up -d

                    sleep 10
                    docker compose -f docker-compose.prod.yml ps
                    curl -f http://127.0.0.1:3000/health
                    curl -f http://127.0.0.1:8080
                    
            - name: Revoke SSH from GitHub runner
              if: always()
              run: |
                aws ec2 revoke-security-group-ingress \
                  --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
                  --protocol tcp \
                  --port 22 \
                  --cidr ${{ steps.ip.outputs.ipv4 }}/32