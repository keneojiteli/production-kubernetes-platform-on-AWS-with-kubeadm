# Runs checks before merging into main
name: CI - Quality and Security Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: 
      - main
      - feature/ec2-monitoring
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Quality - ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            path: ./quiz-app/backend
          - app: frontend
            path: ./quiz-app/frontend
          - app: webhook-receiver
            path: ./deploy/monitoring/webhook-receiver

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

      # - name: Dependency audit
      #   run: npm audit --audit-level=high # --omit=dev

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

  container-validation:
    name: Container Build - ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            path: ./quiz-app/backend
          - app: frontend
            path: ./quiz-app/frontend
          - app: webhook-receiver
            path: ./deploy/monitoring/webhook-receiver

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t "local/${{ matrix.app }}:ci "${{ matrix.path }}" # build images locally on GH runner

  compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate Compose configuration
        run: bash deploy/scripts/validate-compose.sh
